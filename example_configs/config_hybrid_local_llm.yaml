# Hybrid Configuration
# LLM: Ollama with llama3.2 (local)
# Embeddings: OpenAI (cloud) - for better quality
# Storage: AWS S3

aws:
  access_key_id: ${AWS_ACCESS_KEY_ID}
  secret_access_key: ${AWS_SECRET_ACCESS_KEY}
  bucket: eng-llkms
  prefix: knowledge

model:
  provider: ollama
  model: llama3.2
  api_key: ""
  api_base: "http://localhost:11434/v1"
  temperature: 0.7
  max_tokens: 2048

rag:
  retriever_k: 8  # Number of documents to retrieve for context

embeddings:
  provider: openai
  model: text-embedding-3-small
  # Uses OPENAI_API_KEY from environment

app:
  temp_dir: temp
  vector_store_cache: vector_store_cache
