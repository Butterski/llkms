# Qwen2.5 7B Instruct Configuration
# LLM: Ollama with qwen2.5:7b-instruct-q4_K_M
# Embeddings: Ollama with mxbai-embed-large
# Storage: AWS S3

aws:
  access_key_id: ${AWS_ACCESS_KEY_ID}
  secret_access_key: ${AWS_SECRET_ACCESS_KEY}
  bucket: eng-llkms
  prefix: bench_knowledge

model:
  provider: ollama
  model: qwen2.5:7b-instruct-q4_K_M
  api_key: ""
  api_base: "http://localhost:11434/v1"
  temperature: 0.1
  max_tokens: 2048

embeddings:
  provider: ollama
  model: mxbai-embed-large
  api_base: "http://localhost:11434"

app:
  temp_dir: temp
  vector_store_cache: vector_store_cache
