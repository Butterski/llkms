# Gemma 2 9B Configuration
# LLM: Ollama with gemma2:9b-instruct-q4_K_M
# Embeddings: Ollama with bge-m3
# Storage: AWS S3

aws:
  access_key_id: ${AWS_ACCESS_KEY_ID}
  secret_access_key: ${AWS_SECRET_ACCESS_KEY}
  bucket: eng-llkms
  prefix: bench_knowledge

model:
  provider: ollama
  model: gemma2:9b-instruct-q4_K_M
  api_key: ""
  api_base: "http://localhost:11434/v1"
  temperature: 0.1
  max_tokens: 2048

embeddings:
  provider: ollama
  model: bge-m3
  api_base: "http://localhost:11434"

app:
  temp_dir: temp
  vector_store_cache: vector_store_cache
