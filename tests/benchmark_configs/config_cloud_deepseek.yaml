# Full Cloud Configuration
# LLM: DeepSeek API
# Embeddings: OpenAI text-embedding-3-small
# Storage: AWS S3

aws:
  access_key_id: ${AWS_ACCESS_KEY_ID}
  secret_access_key: ${AWS_SECRET_ACCESS_KEY}
  bucket: eng-llkms
  prefix: knowledge

model:
  provider: deepseek
  model: deepseek-chat
  api_key: ${DEEPSEEK_API_KEY}
  api_base: "https://api.deepseek.com"
  temperature: 0.7
  max_tokens: 1024

embeddings:
  provider: openai
  model: text-embedding-3-small
  # api_base not needed for OpenAI

app:
  temp_dir: temp
  vector_store_cache: vector_store_cache
